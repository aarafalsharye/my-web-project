<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تواصل معنا | LUXORA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>LUXORA</h1>

        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="products.html">منتجاتنا</a>
            <a href="pricing.html">الأسعار</a>
            <a href="contact.html">تواصل معنا</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>تواصل معنا واطلب منتجك</h2>

            <p>
                املأ النموذج التالي لإرسال تفاصيل طلبك.
            </p>

            <form action="#" method="get">

                <!-- الاسم الكامل -->
                <label for="name">الاسم الكامل:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <br><br>

                <!-- البريد الإلكتروني -->
                <label for="email">البريد الإلكتروني:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>

                <!-- رقم الهاتف -->
                <label for="phone">رقم الهاتف:</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                >

                <br><br>

                <!-- اختيار المنتج -->
                <label for="product" class="text">اختر المنتج:</label>
                <label for="product" class="email">اختر المنتج:</label>
                <label for="product" class="tel">اختر المنتج:</label>

                <select id="product" name="product" required>

                    <option value="" >اختر منتجًا</option>

                    <option value="sofa">طقم كنب</option>

                    <option value="dining">طاولة طعام</option>

                    <option value="bedroom">غرفة نوم</option>

                    <option value="lighting">إضاءة ديكورية</option>

                    <option value="other">منتج آخر</option>
                
                </select>

                <br><br>

                <!-- نوع الطلب -->
                <p>نوع الطلب:</p>

                <input
                    type="radio"
                    id="purchase"
                    name="request"
                    value="purchase"
                    required
                >

                <label for="purchase">شراء منتج</label>

                <input
                    type="radio"
                    id="design"
                    name="request"
                    value="design"
                >

                <label for="design">تصميم ديكور</label>

                <br><br>

                <!-- الخدمات الإضافية -->
                <p>الخدمات الإضافية:</p>

                <input
                    type="checkbox"
                    id="delivery"
                    name="delivery"
                    value="yes"
                >

                <label for="delivery">التوصيل</label>

                <input
                    type="checkbox"
                    id="installation"
                    name="installation"
                    value="yes"
                >

                <label for="installation">التركيب</label>

                <br><br>

                <!-- تفاصيل الطلب -->
                <label for="message">تفاصيل الطلب:</label>

                <br>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    cols="35"
                    required
                ></textarea>

                <br><br>

                <!-- الموافقة -->
                <input
                    type="checkbox"
                    id="agree"
                    name="agree"
                    required
                >

                <label for="agree">
                    أؤكد صحة البيانات المدخلة.
                </label>

                <br><br>

                <!-- زر الإرسال -->
                <button type="submit">إرسال الطلب</button>

            </form>

        </section>

        <!-- معلومات التواصل -->
        <section>

            <h2>معلومات التواصل</h2>

            <p>البريد الإلكتروني: info@luxora.example</p>

            <p>الهاتف: أضف رقم المتجر هنا</p>

            <h3>موقعنا على الخريطة</h3>

            <iframe
                src="https://www.google.com/maps?q=Sanaa%20Yemen&output=embed"
                width="350"
                height="250"
                title="خريطة توضيحية لمدينة صنعاء">
            </iframe>

        </section>

    </main>

    <footer>

        <p>جميع الحقوق محفوظة &copy; 2026 LUXORA</p>

    </footer>

</body>

</html>
